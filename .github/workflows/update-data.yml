name: 每日更新網站資料

# 每天台灣時間晚上 20:17（UTC 12:17）自動執行；避開整點尖峰以縮短排隊；也可在 Actions 頁面手動觸發。
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      players:
        description: '要重抓的棋士（姓名或 id，多位用逗號分隔；留空＝照常輪替）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install --quiet pillow

      # 每支爬蟲判定資料異常時會以非零狀態結束，既有的 JSON 不會被壞資料覆蓋。
      #
      # 但失敗不能中斷後面的步驟：原本一支失敗就跳過「提交變更」，
      # 連其他抓成功的資料也一起丟掉——2026-10-03 起棋士名錄連續失敗十天，
      # 新聞其實每天都抓到了，卻一次都沒被提交。
      #
      # 所以改成：每支都跑完、有成果就提交，最後再統一把失敗回報出來讓這次執行變紅。
      - name: 抓取賽程行事曆
        id: schedule
        continue-on-error: true
        run: python scripts/scrape_schedule.py site/assets/data/schedule.json --days 60

      - name: 抓取最新消息與賽事
        id: news
        continue-on-error: true
        run: python scripts/scrape_news_games.py site

      # 名單頁每天抓，所以升段、新進棋士隔天就會反映。
      # 個人頁（戰績、簡介）只在秘書處指名時重抓，平常靠 28 天輪替保底。
      #
      # 輸入值用環境變數傳遞，不要直接內插進 shell——
      # ${{ }} 會在 shell 解析前就被替換成字面文字，等於可被注入指令。
      - name: 抓取棋士名錄
        id: players
        continue-on-error: true
        env:
          PLAYERS: ${{ inputs.players }}
        run: |
          if [ -n "$PLAYERS" ]; then
            echo "指定重抓：$PLAYERS"
            python scripts/scrape_players.py site/assets/data/players.json --only "$PLAYERS"
          else
            python scripts/scrape_players.py site/assets/data/players.json
          fi

      # 對戰組合取自抽籤公告，必須在 scrape_news_games 之後執行
      # 第二來源：棋賽賽程操作台輸出的公開文件（2026-10-16 起）。
      # 這是公開唯讀網址、不帶任何憑證，所以直接寫在這裡而不放進 Secrets——
      # 放進 Secrets 反而看不出我們在抓什麼，出事時難追。
      - name: 抓取各輪對戰組合
        id: pairings
        continue-on-error: true
        env:
          PAIRINGS_FEED: 'https://firestore.googleapis.com/v1/projects/test-5cfc9/databases/(default)/documents/public_pairings/current'
        run: python scripts/scrape_pairings.py site

      - name: 抓取精銳隊名單
        id: elite
        continue-on-error: true
        run: python scripts/scrape_elite.py site/assets/data/elite.json

      - name: 下載新增的棋士照片
        id: photos
        continue-on-error: true
        run: python scripts/fetch_photos.py site

      - name: 提交變更
        if: always()
        run: |
          git config user.name  "cpga-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/data site/assets/img/players
          if git diff --staged --quiet; then
            echo "資料沒有變動，不需提交。"
          else
            git commit -m "自動更新網站資料（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')）"
            git push
          fi

      # 放在提交之後：先把抓到的資料存下來，再讓這次執行顯示為失敗。
      # 不這樣做的話，一支爬蟲壞掉會靜默地讓整站資料停止更新。
      - name: 回報爬取失敗
        if: always()
        # 變數名稱必須是 ASCII：shell 的識別字不接受中文，
        # 用 R_棋士名錄 這種名字會讓間接展開一律取到空值，
        # 於是每次執行都被判定為失敗——那個紅燈從頭到尾都是假的。
        env:
          R_SCHEDULE: ${{ steps.schedule.outcome }}
          R_NEWS:     ${{ steps.news.outcome }}
          R_PLAYERS:  ${{ steps.players.outcome }}
          R_PAIRINGS: ${{ steps.pairings.outcome }}
          R_ELITE:    ${{ steps.elite.outcome }}
          R_PHOTOS:   ${{ steps.photos.outcome }}
        run: |
          bad=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error title=$1 抓取失敗::結果為 $2，請檢查上方該步驟的記錄"
              bad=1
            else
              echo "$1 正常"
            fi
          }
          check 賽程行事曆 "$R_SCHEDULE"
          check 最新消息   "$R_NEWS"
          check 棋士名錄   "$R_PLAYERS"
          check 對戰組合   "$R_PAIRINGS"
          check 精銳隊     "$R_ELITE"
          check 棋士照片   "$R_PHOTOS"
          exit $bad
