name: 每日更新網站資料

# 每天台灣時間晚上 20:17（UTC 12:17）自動執行；避開整點尖峰以縮短排隊；也可在 Actions 頁面手動觸發。
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install --quiet pillow

      # 任何一支爬蟲判定資料異常就會以非零狀態結束，整個工作流程失敗並寄信通知，
      # 既有的 JSON 不會被覆蓋。
      - name: 抓取賽程行事曆
        run: python scripts/scrape_schedule.py site/assets/data/schedule.json --days 60

      - name: 抓取最新消息與賽事
        run: python scripts/scrape_news_games.py site

      - name: 抓取棋士名錄
        run: python scripts/scrape_players.py site/assets/data/players.json

      - name: 抓取精銳隊名單
        run: python scripts/scrape_elite.py site/assets/data/elite.json

      - name: 下載新增的棋士照片
        run: python scripts/fetch_photos.py site

      - name: 提交變更
        run: |
          git config user.name  "cpga-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/data site/assets/img/players
          if git diff --staged --quiet; then
            echo "資料沒有變動，不需提交。"
          else
            git commit -m "自動更新網站資料（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')）"
            git push
          fi
