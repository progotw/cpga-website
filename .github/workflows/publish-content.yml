name: 發布協會內容

# 觸發方式有三種：
#   1. 定時：台灣時間週一至週五 08:00–20:00 每 15 分鐘檢查一次，
#      秘書處在後台存檔後不必做別的事，內容有變動就自動發布。
#      本專案為公開 repo，Actions 時數不計費，沒有變動的執行也不會產生提交。
#   2. 後台的「發布」按鈕（需另外建好 Supabase Edge Function，屬選配）。
#   3. 在 Actions 頁面手動執行。
on:
  schedule:
    - cron: '*/15 0-12 * * 1-5'
  repository_dispatch:
    types: [publish-content]
  workflow_dispatch:

permissions:
  contents: write

# 短時間內連按多次發布時，只跑最後一次
concurrency:
  group: publish-content
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install --quiet markdown

      # 匯出程式在資料異常時會以非零狀態結束，既有的 JSON 不會被覆蓋。
      - name: 從資料庫匯出內容
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_content.py site/assets/data

      - name: 提交變更
        run: |
          git config user.name  "cpga-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/data
          if git diff --staged --quiet; then
            echo "內容沒有變動，不需提交。"
          else
            git commit -m "發布協會內容（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')）"
            git push
          fi
