<body data-nav="news">
<!-- 舊連結的入口。
     文章現在每篇一頁（news/p/<新聞id>.html），分享到 LINE 才有標題與縮圖；
     這一頁只負責把 2026-10-29 當天發出去的 ?id= 連結送到該去的地方。
     還沒轉存的文章就送往海峰原文。 -->
<div id="site-header"></div>

<section class="section">
  <div class="wrap text-center">
    <p class="muted" id="msg">開啟文章中…</p>
    <p><a class="btn btn-ghost" href="index.html">← 回最新消息</a></p>
  </div>
</section>

<div id="site-footer"></div>
<script src="../assets/js/site.js" defer></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id') || '';
  var msg = document.getElementById('msg');
  if (!/^[A-Z0-9]{16,40}$/.test(id)) {
    msg.textContent = '網址不完整，請回最新消息重新點選。';
    return;
  }
  var original = 'https://www.haifong.org/news/content/' + id;
  /* replace：看完按「返回」會回到點進來的那一頁，不會又被轉出去一次 */
  fetch('../assets/data/articles/' + id + '.json', { method: 'HEAD', cache: 'no-cache' })
    .then(function (r) {
      location.replace(r.ok ? 'p/' + id + '.html' : original);
    })
    .catch(function () { location.replace(original); });
})();
</script>
</body>
</html>
