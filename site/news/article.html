<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最新消息｜中華職業圍棋協會</title>
<meta name="description" content="中華職業圍棋協會最新消息。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body data-nav="news">
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <nav class="breadcrumb"><a href="../index.html">首頁</a><span class="sep">/</span><a href="index.html">最新消息</a><span class="sep">/</span><a id="artCat" href="index.html">文章</a></nav>
    <h1 class="article-title" id="artTitle">載入中…</h1>
    <p class="article-meta" id="artMeta"></p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="article-wrap">
      <article class="article-body" id="artBody"></article>
      <p class="src-note mt-3" id="artSrc"></p>
      <div class="article-foot">
        <a class="btn btn-ghost" href="index.html">← 回最新消息</a>
      </div>
      <div class="article-more" id="artMoreBox" hidden>
        <h2 class="article-more__title">其他消息</h2>
        <div id="artMore"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../assets/js/content.js"></script>
<script src="../assets/js/site.js" defer></script>
<script>
(function () {
  var N = window.CPGA_NEWS, esc = N.esc;
  var id = new URLSearchParams(location.search).get('id') || '';
  var titleEl = document.getElementById('artTitle');
  var bodyEl = document.getElementById('artBody');
  var srcEl = document.getElementById('artSrc');

  function fail(msg, original) {
    titleEl.textContent = '無法顯示這篇文章';
    bodyEl.innerHTML = '<p class="muted">' + esc(msg) + '</p>' +
      (original ? '<p><a href="' + esc(original) + '">到海峰棋院閱讀原文 →</a></p>' : '');
  }

  if (!/^[A-Z0-9]{16,40}$/.test(id)) {
    fail('網址不完整，請回最新消息重新點選。');
    return;
  }
  var original = 'https://www.haifong.org/news/content/' + id;

  fetch('../assets/data/articles/' + id + '.json', { cache: 'no-cache' })
    .then(function (r) {
      if (r.status === 404) {
        /* 還沒轉存的文章（每天分批轉，舊文章需要一段時間才補完），直接去海峰看原文。
           用 replace：看完按「返回」會回到點進來的那一頁，不會又被轉回海峰。 */
        titleEl.textContent = '前往海峰棋院原文…';
        location.replace(original);
        return null;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (a) {
      if (!a) return;
      document.title = a.title + '｜中華職業圍棋協會';
      var desc = document.querySelector('meta[name="description"]');
      if (desc && a.excerpt) desc.setAttribute('content', a.excerpt);
      /* 整篇轉載自海峰，告訴搜尋引擎原文在哪裡，不要把本站當成重複內容 */
      var canon = document.createElement('link');
      canon.rel = 'canonical';
      canon.href = original;
      document.head.appendChild(canon);

      var cat = document.getElementById('artCat');
      cat.textContent = a.catLabel || '文章';
      cat.href = 'index.html?cat=' + encodeURIComponent(a.cat || '');

      titleEl.textContent = a.title;
      document.getElementById('artMeta').innerHTML =
        '<span>' + esc((a.date || '').replace(/-/g, '.')) + '</span>' +
        (a.catLabel ? '<span class="tag tag--dark">' + esc(a.catLabel) + '</span>' : '');

      bodyEl.innerHTML = N.articleHtml(a.html) ||
        '<p class="muted">這篇消息沒有文字內容。</p>';
      /* 海峰的圖片偶爾會被移除，壞圖就不要留一個破框 */
      [].slice.call(bodyEl.querySelectorAll('img')).forEach(function (img) {
        img.addEventListener('error', function () { img.remove(); });
      });

      srcEl.innerHTML = '本文轉載自<strong>海峰棋院</strong>　·　' +
        '<a href="' + esc(original) + '">閱讀海峰棋院原文</a>';
    })
    .catch(function () {
      fail('文章暫時無法載入，請稍後再試。', original);
    });

  /* 文章下方列出其他消息，看完可以直接點下一篇，不必回列表 */
  N.load().then(function (data) {
    var rows = (data.items || []).filter(function (n) { return n.id !== id; }).slice(0, 6);
    if (!rows.length) return;
    document.getElementById('artMore').innerHTML = N.render(rows);
    document.getElementById('artMoreBox').hidden = false;
  }).catch(function () { /* 列不出來就不顯示 */ });
})();
</script>
</body>
</html>
