<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台｜中華職業圍棋協會</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body style="background:var(--paper-2)">

<div class="admin-bar">
  <div class="admin-bar__inner">
    <a class="admin-bar__title" href="index.html">中華職業圍棋協會　管理後台</a>
    <span class="admin-bar__who" id="who"></span>
    <a class="admin-bar__link" href="../index.html" target="_blank" rel="noopener">看官網 ↗</a>
    <a class="admin-bar__link" href="#" id="logout">登出</a>
  </div>
</div>

<main class="admin-wrap">
  <div class="section-head">
    <h1 style="font-size:1.6rem;margin-bottom:6px">管理後台</h1>
    <p class="muted mb-0" style="font-size:.94rem">
      官網內容改完要按下方的「發布」才會生效；棋士專區的公告與表單則是存檔即生效。
    </p>
  </div>

  <div class="admin-grid mt-3">
    <a class="admin-tile" href="inbox.html">
      <span class="admin-tile__kind">來訊</span>
      <span class="admin-tile__name">收件匣<span id="inboxBadge"></span></span>
      <span class="admin-tile__meta">學生對老師的詢問、棋士提出的意見</span>
    </a>
    <a class="admin-tile" href="announcements.html">
      <span class="admin-tile__kind">棋士專區</span>
      <span class="admin-tile__name">內部公告</span>
      <span class="admin-tile__meta">只有登入的棋士看得到　·　存檔即生效</span>
    </a>
    <a class="admin-tile" href="member-files.html">
      <span class="admin-tile__kind">棋士專區</span>
      <span class="admin-tile__name">表單下載</span>
      <span class="admin-tile__meta">棋士專屬的表單清單　·　存檔即生效</span>
    </a>
    <a class="admin-tile" href="entries.html">
      <span class="admin-tile__kind">棋士專區</span>
      <span class="admin-tile__name">賽事報名</span>
      <span class="admin-tile__meta">職業賽事的開放報名與名單匯出</span>
    </a>
  </div>

  <div class="section-head mt-3" style="margin-top:44px">
    <h2 style="font-size:1.3rem;margin-bottom:6px">官網內容</h2>
    <p class="muted mb-0" style="font-size:.94rem">
      修改後按發布，約一分鐘後會出現在官網。每次發布都會留下紀錄，改錯可以還原。
    </p>
  </div>

  <div id="tiles" class="admin-grid mt-3"><p class="muted">載入中…</p></div>

  <div class="callout mt-3" id="statusBox" hidden></div>

  <div class="publish-bar">
    <div>
      <strong style="display:block;margin-bottom:2px">發布到官網</strong>
      <span class="muted" style="font-size:.88rem">
        平日 08:00–20:00 每 15 分鐘會自動發布一次，存檔後不必做別的事。
        想立刻更新就按右邊的按鈕。
      </span>
    </div>
    <button class="btn btn-accent" id="publishBtn" type="button">發布</button>
  </div>
  <p class="muted mt-2 mb-0" style="font-size:.86rem" id="publishState"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../assets/js/sb-config.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(function () {
  var A = window.CPGA_AUTH;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function when(ts) {
    if (!ts) return '尚未編輯';
    var d = new Date(ts);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return '更新於 ' + d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  document.getElementById('logout').addEventListener('click', function (e) {
    e.preventDefault();
    A.client.auth.signOut().then(function () {
      location.replace('login.html?signedout=1');
    });
  });

  document.getElementById('publishBtn').addEventListener('click', function () {
    var btn = this, state = document.getElementById('publishState');
    if (!window.confirm('確定要把目前的內容發布到官網嗎？')) return;
    btn.disabled = true;
    state.textContent = '發布中…';
    A.publish().then(function () {
      state.innerHTML = '已送出發布，約一分鐘後官網會更新。' +
        '<a href="https://github.com/progotw/cpga-website/actions" target="_blank" rel="noopener">查看進度 ↗</a>';
    }).catch(function (err) {
      /* 立即發布屬選配；沒設定好也不影響定時發布 */
      state.textContent = '立即發布未啟用（' + A.message(err) +
        '）。內容已存檔，會在下一次定時發布時更新。';
    }).finally(function () { btn.disabled = false; });
  });

  /* 收件匣未處理數：只取數量不取內容，載入失敗就不顯示 */
  function inboxBadge() {
    A.client.from('messages').select('id', { count: 'exact', head: true }).eq('handled', false)
      .then(function (res) {
        if (res.error || !res.count) return;
        document.getElementById('inboxBadge').outerHTML =
          '<span class="tile-badge">' + res.count + '</span>';
      }).catch(function () { /* 不顯示就好 */ });
  }

  A.require('admin').then(function (me) {
    inboxBadge();
    document.getElementById('who').textContent =
      (me.profile.display_name || me.user.email) + '　·　管理員';

    return A.client.from('content')
      .select('key, title, kind, updated_at')
      .order('kind', { ascending: true })
      .order('key', { ascending: true });
  }).then(function (res) {
    var box = document.getElementById('tiles');
    if (res.error) throw res.error;
    var rows = res.data || [];
    if (!rows.length) {
      box.innerHTML = '<p class="muted">資料表是空的。請先在 Supabase 的 SQL Editor 執行 ' +
        '<code>supabase/schema.sql</code>。</p>';
      return;
    }
    box.innerHTML = rows.map(function (r) {
      return '<a class="admin-tile" href="edit.html?key=' + encodeURIComponent(r.key) + '">' +
        '<span class="admin-tile__kind">' +
          (r.kind === 'markdown' ? '條文' : '表格') + '</span>' +
        '<span class="admin-tile__name">' + esc(r.title) + '</span>' +
        '<span class="admin-tile__meta">' + esc(r.key) + '.json　·　' + when(r.updated_at) + '</span>' +
        '</a>';
    }).join('');
  }).catch(function (err) {
    var box = document.getElementById('statusBox');
    box.hidden = false;
    box.className = 'callout callout--accent mt-3';
    box.innerHTML = '<p class="mb-0">讀取失敗：' + esc(A.message(err)) + '</p>';
    document.getElementById('tiles').innerHTML = '';
  });
})();
</script>
</body>
</html>
