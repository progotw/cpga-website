<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>內部公告｜管理後台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body style="background:var(--paper-2)">

<div class="admin-bar">
  <div class="admin-bar__inner">
    <a class="admin-bar__title" href="index.html">← 管理後台</a>
    <span class="admin-bar__who" id="who"></span>
    <a class="admin-bar__link" href="#" id="logout">登出</a>
  </div>
</div>

<main class="admin-wrap">
  <div class="section-head">
    <h1 style="font-size:1.5rem;margin-bottom:4px">內部公告</h1>
    <p class="muted mb-0" style="font-size:.92rem">
      只有登入的棋士看得到，不會出現在公開網站上。存檔後立即生效，不需要發布。
    </p>
  </div>

  <div id="notice" class="mt-2"></div>

  <div class="admin-actions" style="border-top:0;padding-top:0;margin-bottom:22px">
    <button class="btn btn-accent" id="newBtn" type="button">＋ 新增公告</button>
    <span class="muted" style="font-size:.86rem" id="state"></span>
  </div>

  <div id="list"><p class="muted">載入中…</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../assets/js/sb-config.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(function () {
  var A = window.CPGA_AUTH;
  var list = document.getElementById('list');
  var state = document.getElementById('state');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function say(kind, text) {
    document.getElementById('notice').innerHTML =
      '<div class="callout' + (kind === 'error' ? ' callout--accent' : '') +
      '"><p class="mb-0" style="font-size:.92rem">' + text + '</p></div>';
  }
  function dateVal(ts) {
    if (!ts) return '';
    var d = new Date(ts), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  document.getElementById('logout').addEventListener('click', function (e) {
    e.preventDefault();
    A.signOut('admin');
  });

  A.require('admin').then(function (me) {
    document.getElementById('who').textContent = me.profile.display_name || me.user.email;
    load();
  });

  function load() {
    A.client.from('announcements')
      .select('*')
      .order('pinned', { ascending: false })
      .order('published_at', { ascending: false, nullsFirst: false })
      .order('id', { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        render(res.data || []);
      })
      .catch(function (err) {
        list.innerHTML = '<p class="muted">載入失敗：' + esc(A.message(err)) + '</p>';
      });
  }

  function cardHtml(a) {
    var id = a.id;
    return '<article class="card ann-card" data-id="' + id + '" style="margin-bottom:16px">' +
      '<div class="field">' +
        '<label>標題</label>' +
        '<input type="text" data-f="title" value="' + esc(a.title) + '">' +
      '</div>' +
      '<div class="field">' +
        '<label>內容</label>' +
        '<textarea data-f="body" rows="5">' + esc(a.body) + '</textarea>' +
      '</div>' +
      '<div class="ann-row">' +
        '<label class="row-check"><input type="checkbox" data-f="published"' +
          (a.published ? ' checked' : '') + '><span>已發布（棋士看得到）</span></label>' +
        '<label class="row-check"><input type="checkbox" data-f="pinned"' +
          (a.pinned ? ' checked' : '') + '><span>置頂</span></label>' +
        '<div class="field row-field" style="max-width:190px;margin:0">' +
          '<label>公告日期</label>' +
          '<input type="date" data-f="published_at" value="' + dateVal(a.published_at) + '">' +
        '</div>' +
      '</div>' +
      '<div class="admin-actions" style="padding-top:14px">' +
        '<button class="btn btn-accent btn-sm" data-act="save" type="button">儲存</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="del" type="button">刪除</button>' +
        '<span class="muted" style="font-size:.84rem" data-role="status"></span>' +
      '</div></article>';
  }

  function render(rows) {
    list.innerHTML = rows.length
      ? rows.map(cardHtml).join('')
      : '<div class="card"><p class="muted mb-0">目前沒有公告。按上方「新增公告」開始。</p></div>';
  }

  document.getElementById('newBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    state.textContent = '新增中…';
    A.client.from('announcements')
      .insert({ title: '（未命名公告）', body: '', published: false })
      .select().single()
      .then(function (res) {
        if (res.error) throw res.error;
        state.textContent = '';
        load();
      })
      .catch(function (err) { say('error', '新增失敗：' + esc(A.message(err))); state.textContent = ''; })
      .finally(function () { btn.disabled = false; });
  });

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var card = btn.closest('.ann-card');
    var id = Number(card.dataset.id);
    var status = card.querySelector('[data-role="status"]');

    if (btn.dataset.act === 'del') {
      if (!window.confirm('確定要刪除這則公告嗎？此動作無法復原。')) return;
      btn.disabled = true;
      A.client.from('announcements').delete().eq('id', id)
        .then(function (res) {
          if (res.error) throw res.error;
          card.remove();
          if (!list.querySelector('.ann-card')) render([]);
        })
        .catch(function (err) { status.textContent = '刪除失敗：' + A.message(err); btn.disabled = false; });
      return;
    }

    /* 儲存 */
    var get = function (f) { return card.querySelector('[data-f="' + f + '"]'); };
    var dateStr = get('published_at').value;
    var patch = {
      title: get('title').value.trim() || '（未命名公告）',
      body: get('body').value,
      published: get('published').checked,
      pinned: get('pinned').checked,
      /* 勾了發布卻沒填日期時補上今天，避免排序時掉到最後面 */
      published_at: dateStr ? new Date(dateStr + 'T00:00:00').toISOString()
                            : (get('published').checked ? new Date().toISOString() : null)
    };

    btn.disabled = true;
    status.textContent = '儲存中…';
    A.client.from('announcements').update(patch).eq('id', id).select().single()
      .then(function (res) {
        if (res.error) throw res.error;
        status.textContent = '已儲存';
        if (!dateStr && patch.published_at) get('published_at').value = dateVal(patch.published_at);
      })
      .catch(function (err) { status.textContent = '儲存失敗：' + A.message(err); })
      .finally(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
