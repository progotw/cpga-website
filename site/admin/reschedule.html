<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對局改期｜協會後台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body style="background:var(--paper-2)">

<div class="admin-bar">
  <div class="admin-bar__inner">
    <a class="admin-bar__title" href="index.html">← 協會後台</a>
    <span class="admin-bar__who" id="who"></span>
    <a class="admin-bar__link" href="#" id="logout">登出</a>
  </div>
</div>

<main class="admin-wrap" style="max-width:980px">
  <div class="section-head">
    <h1 style="font-size:1.5rem;margin-bottom:4px">對局改期與補登</h1>
    <p class="muted mb-0" style="font-size:.92rem">
      賽程操作台提供的是原訂日期。個別對局改期、以及官方來源沒有的場次，
      都在這裡登錄，更新賽程後生效。
    </p>
  </div>

  <div class="callout mt-2">
    <p class="mb-0" style="font-size:.9rem">
      改期後職業棋士專區的「我的賽程」會顯示新日期。<strong>系統不會自動通知棋士</strong>，
      請另行以電話或訊息告知當事人。
    </p>
  </div>

  <div id="notice" class="mt-2"></div>

  <!-- 資料對不起來時才出現，平常是空的 -->
  <div id="dataWarn"></div>

  <!-- 手動補登：平常用不到，收合起來，不要擋住下面的改期清單 -->
  <details class="card mt-2" id="manualBox">
    <summary style="cursor:pointer;font-weight:500">
      手動新增場次
      <span class="muted" style="font-weight:400;font-size:.88rem">
        　世界賽、番棋挑戰賽等官方來源沒有的對局
      </span>
    </summary>

    <p class="muted mt-2" style="font-size:.88rem">
      個人賽程來自海峰的抽籤公告與賽程操作台。不經過抽籤的對局（例如番棋的
      挑戰賽、部分世界賽）兩邊都查不到，當事人就看不到自己這一盤，請在這裡補登。
      之後官方來源出現同一盤棋時會自動讓位，不會重複顯示。
    </p>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="field mb-0" style="flex:0 1 160px">
        <label for="mDate">日期</label>
        <input type="date" id="mDate">
      </div>
      <div class="field mb-0" style="flex:0 1 120px">
        <label for="mTime">時間（選填）</label>
        <input type="time" id="mTime">
      </div>
      <div class="field mb-0" style="flex:1 1 220px">
        <label for="mEvent">賽事</label>
        <input type="text" id="mEvent" maxlength="100" placeholder="例如：第19屆棋王賽">
      </div>
      <div class="field mb-0" style="flex:1 1 180px">
        <label for="mRound">輪次（選填）</label>
        <input type="text" id="mRound" maxlength="100" placeholder="例如：挑戰賽第1局">
      </div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end" class="mt-2">
      <div class="field mb-0" style="flex:1 1 200px">
        <label for="mP1">棋士一</label>
        <select id="mP1"><option value="">載入中…</option></select>
      </div>
      <div class="field mb-0" style="flex:1 1 200px">
        <label for="mP2">棋士二</label>
        <select id="mP2"><option value="">載入中…</option></select>
      </div>
      <div class="field mb-0" style="flex:1 1 200px">
        <label for="mNote">備註（選填，只有後台看得到）</label>
        <input type="text" id="mNote" maxlength="500">
      </div>
    </div>

    <div class="mt-2" style="display:flex;gap:12px;align-items:center">
      <button class="btn btn-accent btn-sm" id="mAdd">新增場次</button>
      <span class="muted" style="font-size:.86rem" id="mState"></span>
    </div>

    <div id="manualList" class="mt-2"></div>
  </details>

  <div class="card mt-2">
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">
      <div class="field mb-0" style="flex:1 1 220px">
        <label for="q">搜尋棋士或賽事</label>
        <input type="text" id="q" placeholder="輸入姓名或賽事名稱">
      </div>
      <div class="field mb-0" style="flex:0 1 180px">
        <label for="scope">範圍</label>
        <select id="scope">
          <option value="future">今天之後</option>
          <option value="changed">已改期的</option>
          <option value="all">全部</option>
        </select>
      </div>
      <span class="muted" style="font-size:.86rem" id="count"></span>
    </div>
  </div>

  <div id="list" class="mt-2"><p class="muted">載入中…</p></div>
</main>

<script src="../assets/js/sb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin-notify.js"></script>
<script>
(function () {
  var A = window.CPGA_AUTH;
  var listEl = document.getElementById('list');
  var pairings = [], over = {}, me = null, manual = [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function say(kind, text) {
    var box = document.getElementById('notice');
    box.innerHTML = text
      ? '<div class="callout' + (kind === 'error' ? ' callout--accent' : '') +
        '"><p class="mb-0" style="font-size:.92rem">' + text + '</p></div>'
      : '';
    var r = box.getBoundingClientRect();
    if (text && (r.top < 0 || r.bottom > window.innerHeight)) {
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  function today() {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    return d;
  }

  document.getElementById('logout').addEventListener('click', function (e) {
    e.preventDefault();
    A.signOut('admin');
  });

  /* 一場對局＝一個可折疊的項目。收起來時只有一行：日期、對手、輪次。
     要改期才點開，不然三個輸入欄位乘上幾十場，整頁都是表單。 */
  function itemHtml(p) {
    var o = over[p.id];
    var names = (p.players || []).filter(Boolean);
    /* 兩邊都還沒定的預排場次，players 是空的——
       寫成「— vs （待定）」會讓人以為少撈到一位棋士。 */
    var who = names.length > 1 ? names.join('　vs　')
            : names.length === 1 ? names[0] + '　vs　（待定）'
            : '對戰組合未定';
    var shown = o ? o.new_date : p.date;
    var shownTime = o ? (o.new_time || p.time || '') : (p.time || '');

    return '<details class="rs-item" data-k="p:' + esc(p.id) + '" data-id="' + esc(p.id) + '">' +
      '<summary>' +
        '<span class="rs-item__when">' + esc(md(shown)) +
          (shownTime ? '　' + esc(shownTime) : '') + '</span>' +
        '<span>' + esc(who) + '</span>' +
        '<span class="muted" style="font-size:.84rem">' + esc(p.round || '') + '</span>' +
        (o ? '<span class="badge-status badge-status--pending">已改期</span>' : '') +
      '</summary>' +

      '<div class="rs-item__body">' +
        '<p class="muted mb-0" style="font-size:.86rem">' +
          '原訂　' + esc(p.date) + (p.time ? '　' + esc(p.time) : '') +
          (o ? '　→　<strong style="color:var(--accent)">' + esc(shown) +
               (shownTime ? '　' + esc(shownTime) : '') + '</strong>' : '') +
          '<br><span style="font-size:.8rem">對局編號　<code>' + esc(p.id) + '</code></span>' +
        '</p>' +

        (o && o.note
          ? '<p class="mb-0 mt-2" style="font-size:.88rem">備註：' + esc(o.note) + '</p>' : '') +

        '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:12px">' +
          '<div class="field mb-0" style="flex:0 1 180px">' +
            '<label>改到</label>' +
            '<input type="date" data-f="date" value="' + esc(o ? o.new_date : p.date) + '">' +
          '</div>' +
          '<div class="field mb-0" style="flex:0 1 130px">' +
            '<label>時間（選填）</label>' +
            '<input type="time" data-f="time" value="' +
              esc(o ? (o.new_time || '') : (p.time || '')) + '">' +
          '</div>' +
          '<div class="field mb-0" style="flex:1 1 200px">' +
            '<label>備註（選填）</label>' +
            '<input type="text" data-f="note" maxlength="500" value="' + esc(o ? o.note : '') +
              '" placeholder="例：棋士出國比賽">' +
          '</div>' +
        '</div>' +

        '<div class="admin-actions mt-2">' +
          '<button class="btn btn-accent btn-sm" data-act="save">儲存改期</button>' +
          (o ? '<button class="btn btn-ghost btn-sm" data-act="cancel">取消改期</button>' : '') +
          '<span class="muted" style="font-size:.84rem" data-state></span>' +
        '</div>' +
      '</div></details>';
  }

  /* 2026-10-23 → 10/23。列表裡年份都一樣，寫出來只是佔位置 */
  function md(d) {
    return String(d || '').slice(5).replace('-', '/');
  }

  /* 記住哪些區塊是開的。render() 會整個重畫，
     存完一筆就把使用者展開的東西全部收起來，等於白開。 */
  function openKeys() {
    var s = {};
    [].forEach.call(listEl.querySelectorAll('details[data-k]'), function (d) {
      if (d.open) s[d.getAttribute('data-k')] = 1;
    });
    return s;
  }
  function restoreKeys(s) {
    [].forEach.call(listEl.querySelectorAll('details[data-k]'), function (d) {
      if (s[d.getAttribute('data-k')]) d.open = true;
    });
  }

  function render(keepOpen) {
    var q = document.getElementById('q').value.trim();
    var scope = document.getElementById('scope').value;
    var t = today();
    var was = keepOpen || openKeys();

    var rows = pairings.filter(function (p) {
      if (!p.id) return false;              // 沒有編號就無從指定，不能改期
      if (scope === 'changed' && !over[p.id]) return false;
      if (scope === 'future') {
        var d = new Date((over[p.id] ? over[p.id].new_date : p.date) + 'T00:00:00');
        if (d < t) return false;
      }
      if (q) {
        var hay = (p.players || []).join('') + (p.event || '') + (p.round || '');
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      var da = over[a.id] ? over[a.id].new_date : a.date;
      var db = over[b.id] ? over[b.id].new_date : b.date;
      return da < db ? -1 : da > db ? 1 : 0;
    });

    document.getElementById('count').textContent = '共 ' + rows.length + ' 場';

    if (!rows.length) {
      listEl.innerHTML = '<p class="muted">沒有符合條件的對局。</p>';
      return;
    }

    /* 依賽事分組，組內維持日期順序（rows 已經排好，不要再動） */
    var order = [], groups = {};
    rows.forEach(function (p) {
      var k = p.event || '（未標示賽事）';
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(p);
    });

    listEl.innerHTML = order.map(function (k) {
      var list = groups[k];
      var changed = list.filter(function (p) { return over[p.id]; }).length;
      var key = 'g:' + k;
      /* 搜尋時使用者就是要看內容，全部展開；
         平常只展開有改期的那幾組，其餘收起來。 */
      var open = was[key] || q || changed > 0;

      return '<details class="rs-group" data-k="' + esc(key) + '"' + (open ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="rs-group__name">' + esc(k) + '</span>' +
          '<span class="muted" style="font-size:.86rem">' + list.length + ' 場' +
            (changed ? '　·　<span style="color:var(--accent)">' + changed + ' 場已改期</span>' : '') +
          '</span>' +
          '<span class="muted" style="font-size:.82rem;margin-left:auto">' +
            esc(md(over[list[0].id] ? over[list[0].id].new_date : list[0].date)) +
            (list.length > 1 ? ' – ' +
              esc(md(over[list[list.length - 1].id]
                ? over[list[list.length - 1].id].new_date
                : list[list.length - 1].date)) : '') +
          '</span>' +
        '</summary>' +
        '<div class="rs-group__body">' + list.map(itemHtml).join('') + '</div>' +
      '</details>';
    }).join('');

    restoreKeys(was);
  }

  function load() {
    return Promise.all([
      fetch('../assets/data/pairings.json', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : { pairings: [] }; }),
      A.client.from('reschedules').select('*'),
      fetch('../assets/data/players.json', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : { players: [] }; }),
      A.client.from('manual_pairings').select('*').order('date')
    ]).then(function (res) {
      pairings = res[0].pairings || [];
      renderWarnings(res[0]);
      if (res[1].error) throw res[1].error;
      over = {};
      (res[1].data || []).forEach(function (r) { over[r.pairing_id] = r; });
      fillPlayers(res[2].players || []);
      /* 補登的表還沒建立時不要讓整頁掛掉，改期仍然要能用 */
      if (res[3].error) {
        document.getElementById('manualList').innerHTML =
          '<p class="muted mb-0" style="font-size:.88rem">手動場次讀取失敗（' +
          esc(A.message(res[3].error)) + '）。</p>';
      } else {
        manual = res[3].data || [];
        renderManual();
      }
      render();
    });
  }

  /* ---- 抓取流程發現的可疑資料 ----
     公告與操作台對不起來時，程式無法判斷哪一邊才對（真的可能同一組人
     下兩次），所以不自動刪，列在這裡讓秘書處看一眼。平常是空的。 */
  function renderWarnings(data) {
    var warns = data.warnings || [], conf = data.conflicts || [];
    var box = document.getElementById('dataWarn');
    if (!warns.length && !conf.length) { box.innerHTML = ''; return; }

    var items = warns.map(function (w) {
      return '<li style="padding:8px 0;border-top:1px solid var(--line)">' +
        '<strong style="color:var(--ink)">' + esc((w.players || []).join('　vs　')) +
          '</strong>　' + esc(w.round || '') +
        '<br><span class="muted" style="font-size:.86rem">同一盤棋出現在兩個日期：' +
        (w.rows || []).map(function (r) {
          return esc(r.date) + (r.time ? ' ' + esc(r.time) : '（未寫時間）') + '　' +
            (r.source === 'announcement' ? '抽籤公告' : '賽程操作台');
        }).join('　／　') + '</span></li>';
    }).concat(conf.map(function (c) {
      return '<li style="padding:8px 0;border-top:1px solid var(--line)">' +
        '<strong style="color:var(--ink)">' + esc(c.date) + '　' + esc(c.player) +
          '</strong><br><span class="muted" style="font-size:.86rem">兩邊寫的對手不同：' +
        '抽籤公告「' + esc(c.announced) + '」／賽程操作台「' + esc(c.feed) + '」' +
        '　·　這幾筆都已從棋士的賽程中剔除</span></li>';
    }));

    box.innerHTML = '<div class="callout callout--accent mt-2">' +
      '<p class="mb-0" style="font-size:.92rem"><strong>賽程資料有 ' + items.length +
        ' 筆對不起來</strong>，請確認哪一邊才對。' +
        '協會決定的改期請用下面的清單登錄；公告或操作台寫錯請聯繫海峰更正。</p>' +
      '<ul style="list-style:none;padding:0;margin:8px 0 0;font-size:.9rem">' +
        items.join('') + '</ul></div>';
  }

  /* ---- 手動補登的場次 ---- */

  function fillPlayers(list) {
    /* 用下拉選單而不是打字：姓名要與棋士名錄一字不差，抓取流程才對得起來，
       打錯一個字就會變成「查無此人」，而且沒有人會發現。 */
    var opts = '<option value="">請選擇</option>' + list.map(function (p) {
      return '<option value="' + esc(p.name) + '">' + esc(p.name) +
        (p.rank ? '（' + esc(p.rank) + '）' : '') + '</option>';
    }).join('');
    ['mP1', 'mP2'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = opts;
    });
  }

  function renderManual() {
    var box = document.getElementById('manualList');
    if (!manual.length) {
      box.innerHTML = '<p class="muted mb-0" style="font-size:.88rem">目前沒有手動新增的場次。</p>';
      return;
    }
    box.innerHTML = '<ul style="list-style:none;padding:0;margin:0;font-size:.9rem">' +
      manual.map(function (m) {
        return '<li style="padding:9px 0;border-top:1px solid var(--line);' +
          'display:flex;gap:12px;align-items:baseline;justify-content:space-between">' +
          '<span><strong style="color:var(--ink)">' + esc(m.date) +
            (m.time ? '　' + esc(m.time) : '') + '</strong>　' +
            esc((m.players || []).join('　vs　')) +
            '<br><span class="muted" style="font-size:.84rem">' + esc(m.event) +
            (m.round ? '・' + esc(m.round) : '') +
            (m.note ? '　·　' + esc(m.note) : '') + '</span></span>' +
          '<button class="btn btn-ghost btn-sm" data-del="' + m.id + '">刪除</button></li>';
      }).join('') + '</ul>';
  }

  document.getElementById('manualList').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-del]');
    if (!btn) return;
    var id = Number(btn.getAttribute('data-del'));
    var m = manual.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    if (!window.confirm('刪除 ' + m.date + ' ' + (m.players || []).join(' vs ') +
                        ' 這一筆？下次更新賽程後棋士就看不到了。')) return;
    btn.disabled = true;
    A.client.from('manual_pairings').delete().eq('id', id).then(function (r) {
      if (r.error) throw r.error;
      manual = manual.filter(function (x) { return x.id !== id; });
      renderManual();
      say('', '已刪除。<strong>要按首頁的「更新賽程」</strong>棋士那邊才會同步。');
    }).catch(function (err) {
      btn.disabled = false;
      say('error', '刪除失敗：' + A.message(err));
    });
  });

  document.getElementById('mAdd').addEventListener('click', function () {
    var btn = this;
    var v = function (id) { return (document.getElementById(id).value || '').trim(); };
    var date = v('mDate'), time = v('mTime'), event = v('mEvent');
    var p1 = v('mP1'), p2 = v('mP2');
    var state = document.getElementById('mState');

    if (!date || !event || !p1 || !p2) {
      state.textContent = '日期、賽事與兩位棋士都要填。';
      return;
    }
    if (p1 === p2) {
      state.textContent = '兩位棋士不能是同一人。';
      return;
    }
    btn.disabled = true;
    state.textContent = '新增中…';
    A.client.from('manual_pairings').insert({
      date: date, time: time, event: event, round: v('mRound'),
      players: [p1, p2], note: v('mNote'), updated_by: me.user.id
    }).select().then(function (r) {
      if (r.error) throw r.error;
      manual = manual.concat(r.data || []).sort(function (a, b) {
        return String(a.date).localeCompare(String(b.date));
      });
      renderManual();
      ['mDate', 'mTime', 'mEvent', 'mRound', 'mP1', 'mP2', 'mNote'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      state.textContent = '';
      btn.disabled = false;
      say('', '已新增。<strong>要按首頁的「更新賽程」</strong>棋士那邊才會出現；' +
            '系統不會自動通知當事人。');
    }).catch(function (err) {
      btn.disabled = false;
      state.textContent = '新增失敗：' + A.message(err);
    });
  });

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('scope').addEventListener('change', render);

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var card = btn.closest('[data-id]');
    var id = card.getAttribute('data-id');
    var p = pairings.filter(function (x) { return x.id === id; })[0];
    var state = card.querySelector('[data-state]');
    var get = function (f) { return card.querySelector('[data-f="' + f + '"]').value.trim(); };

    if (btn.dataset.act === 'cancel') {
      if (!window.confirm('取消改期後會回到原訂日期 ' + p.date + '。確定嗎？')) return;
      btn.disabled = true;
      state.textContent = '處理中…';
      A.client.from('reschedules').delete().eq('pairing_id', id).then(function (r) {
        if (r.error) throw r.error;
        delete over[id];
        render();
        say('', '已取消改期，回到原訂日期。明天的更新後會反映在職業棋士專區。');
      }).catch(function (err) {
        state.textContent = '';
        btn.disabled = false;
        say('error', '取消失敗：' + A.message(err));
      });
      return;
    }

    var d = get('date');
    if (!d) { say('error', '請選擇改期後的日期。'); return; }

    btn.disabled = true;
    state.textContent = '儲存中…';
    /* orig_date 與 players 一併存下來：抓取時要靠它們把公告裡舊日期的
       同一盤棋剔除，否則同一場對局會在新舊兩個日期各出現一次。 */
    A.client.from('reschedules').upsert({
      pairing_id: id,
      new_date: d,
      new_time: get('time'),
      orig_date: (over[id] && over[id].orig_date) || p.date,
      players: (p.players || []).filter(Boolean),
      note: get('note'),
      updated_by: me.user.id
    }, { onConflict: 'pairing_id' }).select().single()
      .then(function (r) {
        if (r.error) throw r.error;
        over[id] = r.data;
        /* 留著展開，不然存完畫面一收，看不到改成什麼 */
        var keep = openKeys(); keep['p:' + id] = 1;
        render(keep);
        say('', '已登錄改期。<strong>明天的資料更新後</strong>才會反映在職業棋士專區，' +
          '請另行通知當事棋士。');
      })
      .catch(function (err) {
        state.textContent = '';
        btn.disabled = false;
        say('error', '儲存失敗：' + A.message(err));
      });
  });

  A.require('admin').then(function (user) {
    me = user;
    document.getElementById('who').textContent = me.profile.display_name || me.user.email;
    return load();
  }).catch(function (err) {
    listEl.innerHTML = '';
    say('error', '載入失敗：' + A.message(err));
  });
})();
</script>
</body>
</html>
