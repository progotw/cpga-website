<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定密碼｜職業棋士專區</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body class="auth-body">

<main class="auth-card">
  <a class="auth-brand" href="../index.html">
    <img src="../assets/img/cpga-logo.png" alt="中華職業圍棋協會">
  </a>

  <h1 id="heading">設定密碼</h1>
  <p class="muted" style="font-size:.92rem" id="lede">載入中…</p>

  <div id="notice" class="mt-2"></div>

  <!-- 信裡的連結帶憑證進來時，要按下這顆按鈕才真的驗證。
       不自動驗證是故意的：手機的信箱 App 會替使用者「預讀」連結，
       自動驗證的話憑證會在那時就被用掉，本人點進來反而失效。 -->
  <div id="startBox" hidden>
    <button class="btn btn-accent btn-block" id="startBtn" type="button">開始設定密碼</button>
    <p class="mb-0 mt-2" id="startState" style="font-size:.9rem"></p>
  </div>

  <form id="pwForm" novalidate hidden>
    <div class="field">
      <label for="pw1">新密碼</label>
      <input type="password" id="pw1" autocomplete="new-password" required>
      <p class="form-note mb-0">至少 8 個字元，建議混用英文字母與數字。</p>
    </div>

    <div class="field">
      <label for="pw2">再輸入一次</label>
      <input type="password" id="pw2" autocomplete="new-password" required>
    </div>

    <button class="btn btn-accent btn-block mt-2" type="submit" id="saveBtn">儲存密碼</button>
    <p class="mb-0 mt-2" id="state" style="font-size:.9rem"></p>
  </form>

  <!-- 連結失效時的自救：自己要一封新的，不必每次都找秘書處 -->
  <form id="resendForm" novalidate hidden>
    <div class="field">
      <label for="reEmail">您的電子信箱</label>
      <input type="email" id="reEmail" autocomplete="email" required placeholder="example@gmail.com">
      <p class="form-note mb-0">請填協會登記的信箱，我們會重新寄一封設定密碼的信給您。</p>
    </div>
    <button class="btn btn-accent btn-block" type="submit" id="resendBtn">重新寄一封</button>
    <p class="mb-0 mt-2" id="resendState" style="font-size:.9rem"></p>
  </form>

  <p class="mt-3 mb-0" style="font-size:.9rem" id="backLink" hidden>
    <a href="home.html">← 回到職業棋士專區</a>
  </p>
</main>

<script src="../assets/js/sb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(function () {
  var A = window.CPGA_AUTH;
  var form = document.getElementById('pwForm');
  var btn = document.getElementById('saveBtn');
  var state = document.getElementById('state');
  var heading = document.getElementById('heading');
  var lede = document.getElementById('lede');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function say(kind, html) {
    document.getElementById('notice').innerHTML = html
      ? '<div class="callout' + (kind === 'error' ? ' callout--accent' : '') +
        '"><p class="mb-0" style="font-size:.92rem">' + html + '</p></div>'
      : '';

    /* 提示框在頁面上方，操作按鈕可能在很下面。訊息出現在看不到的地方時，
       畫面毫無變化，使用者會以為按鈕壞了。 */
    var _n = document.getElementById('notice');
    if (_n) {
      var _r = _n.getBoundingClientRect();
      if (_r.top < 0 || _r.bottom > window.innerHeight) {
        _n.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }
  function fail(msg) {
    state.style.color = 'var(--accent)';
    state.textContent = msg;
  }

  /* 連結失效時一律走這裡：講清楚發生什麼事，並讓他自己要一封新的。
     以前這種情況顯示「請先登入才能變更密碼」——但他就是來設定第一組密碼的，
     等於叫他去做一件做不到的事（2026-11-02 第一位棋士遇到）。 */
  function expired(why) {
    heading.textContent = '這個連結已經失效';
    lede.textContent = '';
    say('error', why || '設定密碼的連結只能使用一次，而且有時效。' +
      '請在下面填寫您的信箱，我們會重新寄一封給您。');
    document.getElementById('resendForm').hidden = false;
  }

  function showForm(first) {
    if (first) {
      heading.textContent = '設定您的密碼';
      lede.textContent = '請設定一組只有您知道的密碼，設定後即可登入職業棋士專區。';
    } else {
      heading.textContent = '變更密碼';
      lede.textContent = '建議在拿到初始密碼後立刻換成只有您知道的密碼。';
      document.getElementById('backLink').hidden = false;
    }
    document.getElementById('startBox').hidden = true;
    say('', '');
    form.hidden = false;
  }

  /* ---- 進入這一頁的三種方式 ----
     1. 信裡的連結（新版）：?token_hash=…&type=invite|recovery
        憑證放在網址參數裡，按下按鈕才驗證。
     2. 信裡的連結（舊版，2026-11-02 之前寄出的）：#access_token=…
        supabase-js 會自動換成登入狀態，這裡只要確認有沒有登入。
     3. 已經登入，自己進來換密碼。 */
  var params = new URLSearchParams(location.search);
  var tokenHash = params.get('token_hash') || '';
  var linkType = params.get('type') === 'recovery' ? 'recovery' : 'invite';
  var hash = location.hash || '';
  var oldLink = /[#&](access_token|type)=/.test(hash);
  var hashError = /[#&]error/.test(hash);

  if (tokenHash) {
    heading.textContent = linkType === 'recovery' ? '重設密碼' : '設定您的密碼';
    lede.textContent = '按下方按鈕後就可以設定密碼。';
    document.getElementById('startBox').hidden = false;

    document.getElementById('startBtn').addEventListener('click', function () {
      var b = this, st = document.getElementById('startState');
      b.disabled = true;
      st.style.color = '';
      st.textContent = '確認中…';
      A.client.auth.verifyOtp({ token_hash: tokenHash, type: linkType })
        .then(function (res) {
          if (res.error) throw res.error;
          /* 憑證已經用掉了，從網址上清掉，免得被複製轉傳 */
          history.replaceState(null, '', location.pathname);
          st.textContent = '';
          showForm(true);
        })
        .catch(function () {
          document.getElementById('startBox').hidden = true;
          expired();
        });
    });
  } else {
    A.client.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (session) {
        if (oldLink) history.replaceState(null, '', location.pathname);
        showForm(oldLink);
        return;
      }
      if (oldLink || hashError) {
        expired();
        return;
      }
      lede.textContent = '';
      say('error', '請先登入才能變更密碼。<br><a href="login.html">前往登入</a>');
    }).catch(function (err) {
      lede.textContent = '';
      say('error', '載入失敗：' + esc(A.message(err)));
    });
  }

  /* ---- 重新寄一封 ---- */
  document.getElementById('resendForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = document.getElementById('resendBtn');
    var st = document.getElementById('resendState');
    var email = (document.getElementById('reEmail').value || '').trim();
    if (!email) { st.style.color = 'var(--accent)'; st.textContent = '請填寫信箱。'; return; }

    b.disabled = true;
    st.style.color = '';
    st.textContent = '寄送中…';
    A.client.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + '/member/password'
    }).then(function (res) {
      if (res.error) throw res.error;
      /* 不說「這個信箱不存在」：那等於讓外人可以試出誰有帳號。
         真的沒有這個帳號時，信就不會寄出，棋士找秘書處即可。 */
      st.textContent = '';
      document.getElementById('resendForm').hidden = true;
      say('', '已寄出。請到信箱收信（寄件者 noreply@cpga.org.tw），' +
        '點信裡的按鈕就能設定密碼。<br>' +
        '沒收到的話請先看垃圾郵件匣，或聯絡秘書處 (02) 2702-8898 轉 126。');
    }).catch(function (err) {
      b.disabled = false;
      st.style.color = 'var(--accent)';
      st.textContent = '寄送失敗：' + A.message(err);
    });
  });

  /* ---- 儲存新密碼 ---- */
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    state.style.color = '';
    state.textContent = '';

    var a = document.getElementById('pw1').value;
    var b = document.getElementById('pw2').value;

    if (a.length < 8) { fail('密碼至少要 8 個字元。'); return; }
    if (a !== b) { fail('兩次輸入的密碼不一樣。'); return; }

    btn.disabled = true;
    state.textContent = '儲存中…';

    A.client.auth.updateUser({ password: a }).then(function (res) {
      if (res.error) throw res.error;
      form.hidden = true;
      heading.textContent = '密碼已設定';
      lede.textContent = '';
      say('', '密碼已設定完成。<br><a href="home.html">前往職業棋士專區 →</a>');
    }).catch(function (err) {
      btn.disabled = false;
      state.style.color = 'var(--accent)';
      state.textContent = '儲存失敗：' + A.message(err);
    });
  });
})();
</script>
</body>
</html>
