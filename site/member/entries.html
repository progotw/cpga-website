<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽事報名｜棋士專區</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body style="background:var(--paper-2)">

<div class="admin-bar">
  <div class="admin-bar__inner">
    <a class="admin-bar__title" href="home.html">← 棋士專區</a>
    <span class="admin-bar__who" id="who"></span>
    <a class="admin-bar__link" href="#" id="logout">登出</a>
  </div>
</div>

<main class="admin-wrap" style="max-width:820px">
  <div class="section-head">
    <h1 style="font-size:1.5rem;margin-bottom:4px">賽事報名</h1>
    <p class="muted mb-0" style="font-size:.92rem">
      職業賽事免報名費。報名後在截止前都可以取消或修改備註。
    </p>
  </div>

  <div id="notice" class="mt-2"></div>
  <div id="list" class="mt-2"><p class="muted">載入中…</p></div>
</main>

<script src="../assets/js/sb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(function () {
  var A = window.CPGA_AUTH;
  var listEl = document.getElementById('list');
  var me = null, rows = [], mine = {}, viewOnly = false;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function say(kind, html) {
    document.getElementById('notice').innerHTML = html
      ? '<div class="callout' + (kind === 'error' ? ' callout--accent' : '') +
        '"><p class="mb-0" style="font-size:.92rem">' + html + '</p></div>'
      : '';
  }
  function fmt(ts) {
    if (!ts) return '';
    var d = new Date(ts), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* 報名期間同時在資料庫層把關（entry_open），這裡只決定畫面長相 */
  function phaseOf(t) {
    var now = Date.now();
    if (t.opens_at && now < new Date(t.opens_at).getTime()) return 'before';
    if (t.closes_at && now > new Date(t.closes_at).getTime()) return 'after';
    return 'open';
  }

  document.getElementById('logout').addEventListener('click', function (e) {
    e.preventDefault();
    A.signOut('player');
  });

  function periodHtml(t) {
    if (!t.opens_at && !t.closes_at) return '';
    var s = t.opens_at ? fmt(t.opens_at) : '即日起';
    var e = t.closes_at ? fmt(t.closes_at) : '另行公告';
    return '<p class="muted mb-0" style="font-size:.86rem">報名期間　' +
      esc(s) + '　至　' + esc(e) + '</p>';
  }

  function cardHtml(t) {
    var phase = phaseOf(t);
    var ent = mine[t.id];
    var joined = ent && !ent.withdrawn;

    var badge = joined
      ? '<span class="badge-status badge-status--done">已報名</span>'
      : (phase === 'before' ? '<span class="badge-status badge-status--soon">尚未開放</span>'
        : phase === 'after' ? '<span class="badge-status badge-status--pending">已截止</span>' : '');

    var actions;
    if (viewOnly) {
      actions = '<span class="muted" style="font-size:.86rem">管理員檢視中，無法報名。</span>';
    } else if (phase === 'open') {
      actions = joined
        ? '<button class="btn btn-ghost btn-sm" data-act="withdraw" data-id="' + t.id + '">取消報名</button>'
        : '<button class="btn btn-accent btn-sm" data-act="enter" data-id="' + t.id + '">我要報名</button>';
    } else if (phase === 'after') {
      actions = '<span class="muted" style="font-size:.86rem">' +
        (joined ? '報名已截止，如需異動請聯繫秘書處。' : '報名已截止。') + '</span>';
    } else {
      actions = '<span class="muted" style="font-size:.86rem">報名尚未開始。</span>';
    }

    var noteBox = (!viewOnly && phase === 'open' && joined)
      ? '<div class="field mt-2">' +
          '<label for="note' + t.id + '">備註（選填，例如不便出席的時段）</label>' +
          '<textarea id="note' + t.id + '" rows="2" maxlength="500" data-note="' + t.id + '">' +
            esc(ent.note || '') + '</textarea>' +
          '<div class="mt-2"><button class="btn btn-ghost btn-sm" data-act="note" data-id="' + t.id + '">儲存備註</button></div>' +
        '</div>'
      : (joined && ent.note
          ? '<p class="muted mb-0 mt-2" style="font-size:.86rem">備註：' + esc(ent.note) + '</p>'
          : '');

    return '<div class="card mt-2" data-card="' + t.id + '">' +
      '<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">' +
        '<h2 style="font-size:1.1rem;margin:0;flex:1 1 auto">' + esc(t.title) + '</h2>' + badge +
      '</div>' +
      periodHtml(t) +
      (t.note ? '<p class="mb-0 mt-2" style="font-size:.92rem">' + esc(t.note) + '</p>' : '') +
      (t.eligibility
        ? '<p class="muted mb-0 mt-2" style="font-size:.86rem">參賽資格：' + esc(t.eligibility) + '</p>'
        : '') +
      noteBox +
      '<div class="admin-actions mt-2">' + actions +
        '<span class="muted" style="font-size:.84rem" data-state="' + t.id + '"></span>' +
      '</div>' +
    '</div>';
  }

  function render() {
    if (!rows.length) {
      listEl.innerHTML =
        '<div class="card" style="text-align:center;padding:40px 24px">' +
          '<p class="muted mb-0">目前沒有開放報名的賽事。</p>' +
          '<p class="muted mb-0" style="font-size:.86rem">開放報名時會在此顯示，' +
            '也會發布於<a href="home.html">棋士專區</a>的內部公告。</p>' +
        '</div>';
      return;
    }
    listEl.innerHTML = rows.map(cardHtml).join('');
  }

  function load() {
    return Promise.all([
      A.client.from('tournaments').select('*')
        .order('sort', { ascending: false })
        .order('closes_at', { ascending: true, nullsFirst: false })
        .order('id', { ascending: false }),
      A.client.from('entries').select('tournament_id,withdrawn,note')
    ]).then(function (res) {
      if (res[0].error) throw res[0].error;
      if (res[1].error) throw res[1].error;
      rows = res[0].data || [];
      mine = {};
      (res[1].data || []).forEach(function (e) { mine[e.tournament_id] = e; });
      render();
    });
  }

  function busy(id, text) {
    var el = listEl.querySelector('[data-state="' + id + '"]');
    if (el) el.textContent = text || '';
  }

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var id = Number(btn.getAttribute('data-id'));
    var act = btn.getAttribute('data-act');
    btn.disabled = true;
    say('', '');

    var work;
    if (act === 'enter') {
      var existing = mine[id];
      work = existing
        /* 取消過再報名：原本那列還在（unique 限制），改回 withdrawn=false */
        ? A.client.from('entries').update({ withdrawn: false })
            .eq('tournament_id', id).eq('user_id', me.user.id)
        : A.client.from('entries').insert({
            tournament_id: id,
            user_id: me.user.id,
            player_id: me.profile.player_id || '',
            display_name: me.profile.display_name || me.user.email
          });
      busy(id, '報名中…');
    } else if (act === 'withdraw') {
      if (!confirm('確定要取消報名嗎？截止前可以再報名一次。')) {
        btn.disabled = false; return;
      }
      work = A.client.from('entries').update({ withdrawn: true })
        .eq('tournament_id', id).eq('user_id', me.user.id);
      busy(id, '處理中…');
    } else {
      var box = listEl.querySelector('[data-note="' + id + '"]');
      work = A.client.from('entries').update({ note: box ? box.value.trim() : '' })
        .eq('tournament_id', id).eq('user_id', me.user.id);
      busy(id, '儲存中…');
    }

    work.then(function (res) {
      if (res.error) throw res.error;
      return load();
    }).then(function () {
      say('', act === 'enter' ? '已完成報名。'
        : act === 'withdraw' ? '已取消報名。' : '備註已儲存。');
    }).catch(function (err) {
      btn.disabled = false;
      busy(id, '');
      /* 政策擋下來多半是截止了：舊分頁上的按鈕還看得到，但資料庫不收 */
      say('error', '操作失敗：' + esc(A.message(err)) +
        '<br>若賽事已截止，請重新整理頁面確認狀態。');
    });
  });

  A.require('player').then(function (user) {
    me = user;
    viewOnly = me.profile.role === 'admin';
    document.getElementById('who').textContent =
      (me.profile.display_name || me.user.email) + (viewOnly ? '　·　管理員檢視' : '');
    if (viewOnly) {
      say('', '您是以管理員身分檢視這個畫面。報名功能只開放給棋士帳號——' +
        '管理員報名會在名單裡留下一筆沒有對應棋士的紀錄。');
    }
    return load();
  }).catch(function (err) {
    listEl.innerHTML = '';
    say('error', '載入失敗：' + esc(A.message(err)));
  });
})();
</script>
</body>
</html>
