<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的對局費｜職業棋士專區</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
</head>
<body style="background:var(--paper-2)">

<div class="admin-bar">
  <div class="admin-bar__inner">
    <a class="admin-bar__title" href="home.html">← 職業棋士專區</a>
    <span class="admin-bar__who" id="who"></span>
    <a class="admin-bar__link" href="#" id="logout">登出</a>
  </div>
</div>

<main class="admin-wrap" style="max-width:760px">
  <div class="section-head">
    <h1 style="font-size:1.5rem;margin-bottom:4px">我的對局費</h1>
    <p class="muted mb-0" style="font-size:.92rem" id="sub">　</p>
  </div>

  <div id="notice" class="mt-2"></div>
  <!-- 年度切換。只有一個年度時不顯示 -->
  <div class="tabs mt-2" id="years" style="margin-bottom:0" hidden></div>
  <div id="body" class="mt-2"><p class="muted">載入中…</p></div>
</main>

<script src="../assets/js/sb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(function () {
  var A = window.CPGA_AUTH;
  var box = document.getElementById('body');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function say(kind, text) {
    var n = document.getElementById('notice');
    n.innerHTML = text
      ? '<div class="callout' + (kind === 'error' ? ' callout--accent' : '') +
        '"><p class="mb-0" style="font-size:.92rem">' + text + '</p></div>'
      : '';
  }
  /* 金額一律加千分位。對局費是錢，少一位數看錯的代價不小。 */
  function money(n) {
    return Number(n || 0).toLocaleString('en-US');
  }
  /* 賽事的排列順序由秘書處指定。名單以外的賽事（十段、霸王賽、世界賽等）
     排在後面，維持原本的順序。

     比對前先正規化：資料來源的寫法不一致——2025 年是協會 Excel 的簡稱
     （天元、中環碁聖、快棋爭霸戰），2026 年起是院方系統的全名
     （中環天元賽）。去掉「中環」「圍棋」與結尾的賽／戰／盃之後兩邊就對得上，
     哪一年的資料都照這個順序排。 */
  var EVENT_ORDER = [
    '中環天元賽', '海峰盃', '名人賽', '快棋爭霸賽', '玄樂盃', '新人王',
    '女子圍棋最強戰', '棋王賽', '中環碁聖賽', '中環國手賽', '龍星賽'
  ];
  var ORDER_INDEX = {};
  function eventKey(s) {
    return String(s == null ? '' : s)
      .replace(/\s+/g, '').replace(/中環|圍棋/g, '').replace(/[賽戰盃杯]+$/, '');
  }
  EVENT_ORDER.forEach(function (name, i) { ORDER_INDEX[eventKey(name)] = i; });

  function sortEvents(events) {
    /* 先記下原本的位置再排，舊瀏覽器的 sort 不保證穩定 */
    return events.map(function (ev, i) { return { ev: ev, i: i }; })
      .sort(function (a, b) {
        var ra = ORDER_INDEX[eventKey(a.ev.event)];
        var rb = ORDER_INDEX[eventKey(b.ev.event)];
        if (ra === undefined) ra = EVENT_ORDER.length + a.i;
        if (rb === undefined) rb = EVENT_ORDER.length + b.i;
        return ra - rb || a.i - b.i;
      })
      .map(function (x) { return x.ev; });
  }

  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate());
  }

  document.getElementById('logout').addEventListener('click', function (e) {
    e.preventDefault();
    A.signOut('player');
  });

  function render(row) {
    var events = sortEvents(row.events || []);
    document.getElementById('sub').textContent =
      row.year + ' 年度　·　院方發布：' + when(row.published_at);

    box.innerHTML =
      '<div class="card" style="border-left:4px solid var(--navy)">' +
        '<p class="muted mb-0" style="font-size:.9rem">' + row.year + ' 年合計</p>' +
        '<p class="mb-0" style="font-size:1.7rem;font-weight:700;color:var(--ink)">' +
          money(row.total) + ' <span style="font-size:1rem;font-weight:400">元</span></p>' +
      '</div>' +

      events.map(function (ev) {
        return '<div class="card mt-2">' +
          '<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">' +
            '<strong style="font-size:1.02rem">' + esc(ev.event || '') + '</strong>' +
            '<strong style="font-variant-numeric:tabular-nums">' +
              money(ev.subtotal) + '</strong>' +
          '</div>' +
          '<ul style="list-style:none;padding:0;margin:8px 0 0;font-size:.9rem">' +
            (ev.items || []).map(function (it) {
              return '<li style="display:flex;justify-content:space-between;gap:12px;' +
                'padding:6px 0;border-top:1px solid var(--line)">' +
                '<span>' + esc(it.item || '') +
                  (it.detail ? '　<span class="muted" style="font-size:.84rem">' +
                    esc(it.detail) + '</span>' : '') + '</span>' +
                /* 負數是院方的金額調整，用顏色標出來，不然混在一堆數字裡看不見 */
                '<span style="flex:none;font-variant-numeric:tabular-nums' +
                  (Number(it.amount) < 0 ? ';color:var(--accent)' : '') + '">' +
                  money(it.amount) + '</span></li>';
            }).join('') +
          '</ul></div>';
      }).join('') +

      '<p class="muted mt-3 mb-0" style="font-size:.86rem">' +
        '金額以院方發布為準，實際撥款時間另行通知。' +
        '這份是應領金額，不是匯款紀錄。<br>' +
        '有疑問請洽秘書處，或從<a href="feedback.html">意見與申訴</a>提出。</p>';
  }

  /* 年度按鈕。院方每年發布一次，舊年度留著讓棋士回頭對帳；
     只有一個年度時不顯示，免得畫面多一排沒用的按鈕。 */
  function renderYears(rows) {
    if (rows.length < 2) return;
    var tabs = document.getElementById('years');
    tabs.innerHTML = rows.map(function (r, i) {
      return '<button class="tab' + (i ? '' : ' is-active') + '" data-year="' +
        esc(r.year) + '">' + esc(r.year) + '</button>';
    }).join('');
    tabs.hidden = false;
    tabs.addEventListener('click', function (e) {
      var btn = e.target.closest('.tab');
      if (!btn) return;
      [].slice.call(this.querySelectorAll('.tab')).forEach(function (t) {
        t.classList.toggle('is-active', t === btn);
      });
      rows.forEach(function (r) {
        if (String(r.year) === btn.getAttribute('data-year')) render(r);
      });
    });
  }

  A.require('player').then(function (me) {
    document.getElementById('who').textContent = me.profile.display_name || me.user.email;

    if (!me.profile.player_id) {
      box.innerHTML = '';
      say('error', '此帳號尚未對應到棋士名錄，無法顯示對局費，請洽秘書處。');
      return;
    }

    /* 條件寫出來，不是只靠資料列權限：require('player') 會放管理員進來，
       而管理員讀得到所有人的對局費，不加條件這頁會列出別人的金額。 */
    return A.client.from('player_fees').select('*')
      .eq('player_id', me.profile.player_id)
      .order('year', { ascending: false })
      .limit(20)
      .then(function (res) {
        if (res.error) throw res.error;
        var rows = res.data || [];
        if (!rows.length) {
          document.getElementById('sub').textContent = '';
          box.innerHTML = '<div class="card"><p class="muted mb-0">' +
            '今年尚無對局費紀錄。院方核算並發布後會出現在這裡。</p></div>';
          return;
        }
        renderYears(rows);
        render(rows[0]);
      });
  }).catch(function (err) {
    box.innerHTML = '';
    say('error', '載入失敗：' + esc(A.message(err)));
  });
})();
</script>
</body>
</html>
