<script src="../assets/js/cms.js"></script>

<script>
(function () {
  var C = window.CPGA_CMS, el = document.getElementById('qualBody');
  C.load('qualification').then(function (d) {
    /* html 由 scripts/render_content.py 從 Markdown 轉出並過濾過標籤 */
    el.innerHTML = d.html || '';
  }).catch(function (e) { C.fail(el, e); });
})();
</script>
<script src="../assets/js/page-toc.js"></script>
<script>
(function () {
  var C = window.CPGA_CMS, el = document.getElementById('qualDl');
  C.load('downloads').then(function (d) {
    el.innerHTML = C.dlListHtml((d.items || []).filter(function (x) {
      return x.cat === '甄選辦法';
    }), '../');
  }).catch(function (e) { C.fail(el, e); });
})();

(function () {
  var esc = window.CPGA_NEWS.esc;
  window.CPGA_GAMES.load().then(function (data) {
    var rows = (data.games || []).filter(function (g) { return g.category === '職棋甄選'; });
    document.getElementById('qualGames').innerHTML = rows.length
      ? '<ul style="list-style:none;padding:0;margin:0;font-size:.92rem">' + rows.map(function (g) {
          return '<li style="margin-bottom:8px"><a href="' + esc(g.url) + '" target="_blank" rel="noopener">' +
            esc(g.name) + ' ↗</a></li>';
        }).join('') + '</ul>'
      : '<p class="muted mb-0" style="font-size:.9rem">尚無資料。</p>';
  }).catch(function () {
    document.getElementById('qualGames').innerHTML = '<p class="muted mb-0" style="font-size:.9rem">載入失敗。</p>';
  });
})();
</script>
