    <div class="section-head mt-3"><h2 style="font-size:1.4rem">報名方式</h2></div>
    <ol class="steps" style="margin-bottom:2rem">
      <li><h3>查看簡章</h3><p>各賽事簡章於報名開始前公告於 <a href="../news/index.html?cat=notice">公告</a> 與 <a href="../downloads/index.html">下載專區</a>。</p></li>
      <li><h3>填寫報名表</h3><p>下載報名表填妥後，以電子郵件寄回協會信箱；團體報名請一併附上名單。</p></li>
      <li><h3>繳交報名費</h3><p>依簡章指定方式匯款，並於匯款後回覆帳號後五碼以利核對。</p></li>
      <li><h3>確認參賽</h3><p>報名截止後，協會將寄發參賽確認信與對戰編組。</p></li>
