<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋士介紹｜中華職業圍棋協會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
<style>
  /* 棋戰履歷為原站富文字內容，統一排版 */
  .player-bio p { margin: 0 0 .9em; }
  .player-bio strong { color: var(--ink); }
  .player-bio br + br { display: none; }
</style>
</head>
<body data-nav="players">
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <nav class="breadcrumb">
      <a href="../index.html">首頁</a><span class="sep">/</span>
      <a href="index.html">職業棋士</a><span class="sep">/</span><span id="bcName">棋士介紹</span>
    </nav>
    <h1 id="pName">—</h1>
    <p id="pSub"></p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div id="profileWrap"><p class="muted">載入中…</p></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../assets/js/players.js"></script>
<!-- 成績資料。原本載入海峰那邊的 player-widget.js，但那支程式放在
     對方的 GitHub Pages，內容隨時可改而我們不會知道——它被載入在
     有登入身分的頁面上，對方帳號被盜就等於我們的權限被拿走。
     改成自己讀同一份公開資料，不執行任何外部程式。 -->
<script src="../assets/js/results.js"></script>
<script src="../assets/js/site.js" defer></script>
<script>
(function () {
  var P = window.CPGA_PLAYERS;
  var id = new URLSearchParams(location.search).get('id');
  var wrap = document.getElementById('profileWrap');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 棋士自述另存一份：players.json 每天重新產生，把本人寫的內容寫進去
     會被下一次抓取蓋掉，所以分開放、在這裡合併。 */
  function tiles(rows) {
    return rows.map(function (s) {
      return '<div class="stat-tile">' +
        '<div class="stat-tile__label">' + esc(s.label) + '</div>' +
        '<div class="stat-tile__value" style="font-size:1.25rem">' + esc(s.value) + '</div></div>';
    }).join('');
  }

  /* ---- 即時年度成績 ----
     成績系統的分類與我們抓的對得上：國內＝台灣職業賽、國際＝世界賽，
     去年度直接用它的年度統計（實測與抓取版完全一致）。
     任何一步失敗就保留原本的數字，不留空白。 */
  function liveSeason(p) {
    var box = document.getElementById('seasonTiles');
    if (!box || !window.HaifongResults || !p.name) return;

    window.HaifongResults.player(p.name).then(function (r) {
      var now = new Date().getFullYear();
      var games = (r.games || []).filter(function (g) { return g.year === String(now); });
      var prev = (r.years || []).filter(function (y) {
        return String(y.year) === String(now - 1);
      })[0];
      if (!games.length && !prev) return;

      function tally(list) {
        var n = list.length;
        var w = list.filter(function (g) { return g.won; }).length;
        return n ? w + '勝' + (n - w) + '負　勝率' + (w / n * 100).toFixed(1) + '%'
                 : '0勝0負';
      }

      box.innerHTML = tiles([
        { label: '台灣職業賽',
          value: tally(games.filter(function (g) { return g.c1 !== '國際'; })) },
        { label: '世界賽',
          value: tally(games.filter(function (g) { return g.c1 === '國際'; })) },
        { label: (now - 1) + ' 年度總成績',
          value: prev ? prev.win + '勝' + prev.loss + '負　勝率' +
                        (prev.rate * 100).toFixed(1) + '%' : '—' }
      ]);

      var label = document.getElementById('seasonLabel');
      if (label) {
        label.textContent = now + ' 年度成績';
        label.insertAdjacentHTML('afterend',
          '<p class="muted mb-0" style="font-size:.82rem">即時取自海峰成績系統</p>');
      }
    }).catch(function () { /* 保留抓取版本的數字 */ });
  }

  Promise.all([
    P.load(),
    fetch('../assets/data/player_profiles.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : { profiles: [] }; })
      .catch(function () { return { profiles: [] }; })
  ]).then(function (res) {
    var data = res[0];
    var own = (res[1].profiles || []).filter(function (x) { return x.id === id; })[0] || {};
    var p = P.byId(data, id);
    if (!p) {
      document.getElementById('pName').textContent = '找不到此棋士';
      wrap.innerHTML = '<p><a href="index.html">← 回到棋士名錄</a></p>';
      return;
    }

    var list = data.players || [];
    var idx = list.indexOf(p);
    var prev = list[idx - 1], next = list[idx + 1];

    document.title = p.name + ' ' + p.rank + '｜中華職業圍棋協會';
    document.getElementById('bcName').textContent = p.name;
    document.getElementById('pName').textContent = p.name + '　' + p.rank;
    /* history 可能有「頭銜冠軍」與「歷史成績」兩列，順序不固定 */
    var hists = p.history || [];
    var record = hists.filter(function (h) { return /冠軍數/.test(h.value) || /歷史成績/.test(h.label); })[0];
    document.getElementById('pSub').textContent =
      record ? record.value : (hists[0] ? hists[0].label + '：' + hists[0].value : '本會登錄職業棋士');

    var photo = p.photo
      ? '<img src="' + esc(P.photoUrl(p)) + '" alt="' + esc(p.name) + '" ' +
        'style="width:100%;aspect-ratio:1;object-fit:cover;display:block">'
      : '<div class="player-card__photo"><span class="player-card__initial">' +
        esc(p.name.charAt(0)) + '</span></div>';

    /* 先畫每月抓取的版本，成績系統回來後再換成即時數字。
       那邊比我們新——我們一個月抓一次，他們每場比賽結束就更新。 */
    var seasonTiles = tiles(p.season || []);

    /* 本人填的排在前面，與原有連結合併；同一個網址只留一次 */
    var seenUrl = {};
    var allLinks = (own.links || []).concat(p.links || []).filter(function (l) {
      var u = (l && P.safeUrl(l.url) || '').replace(/\/+$/, '');
      if (!u || seenUrl[u]) return false;
      seenUrl[u] = 1;
      return true;
    });

    /* 網址先過協定白名單：這些連結是棋士自己填的，
       javascript: 放進 href 就會在公開頁面上執行 */
    var linkBtns = allLinks.map(function (l) {
      l = { label: l.label, url: P.safeUrl(l.url) };
      return '<a class="btn btn-ghost btn-sm" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
        esc(l.label) + ' ↗</a>';
    }).join('');

    wrap.innerHTML =
      '<div class="grid grid-aside" style="grid-template-columns:300px minmax(0,1fr);gap:44px">' +

        '<div class="stack">' +
          '<div class="card" style="padding:0;overflow:hidden;position:relative">' +
            photo +
            '<span class="player-card__rank" style="top:14px;right:14px">' + esc(p.rank) + '</span>' +
          '</div>' +
          (hists.length
            ? '<div class="card">' + hists.map(function (h, i) {
                return '<div' + (i ? ' style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"' : '') + '>' +
                  '<h3 style="font-size:.86rem;font-family:var(--sans);letter-spacing:.06em;color:var(--ink-4);margin-bottom:4px">' +
                  esc(h.label) + '</h3>' +
                  '<p class="mb-0" style="color:var(--ink);font-weight:500">' + esc(h.value) + '</p></div>';
              }).join('') + '</div>'
            : '') +
          (linkBtns
            ? '<div class="card"><h3 style="font-size:1.05rem">相關連結</h3>' +
              '<div style="display:flex;flex-direction:column;gap:8px">' + linkBtns + '</div></div>'
            : '') +
        '</div>' +

        '<div>' +
          (seasonTiles
            ? '<div class="section-head" style="margin-bottom:16px"><h2 id="seasonLabel" style="font-size:1.3rem">' +
              esc(p.seasonLabel || '年度成績') + '</h2></div>' +
              '<div class="grid grid-3" id="seasonTiles" style="margin-bottom:32px">' + seasonTiles + '</div>'
            : '') +

          /* 自述放在最上面，不取代原本的簡介——那裡面有主要棋戰履歷 */
          (own.bio
            ? '<article class="prose player-bio" style="padding-bottom:4px">' +
                own.bio.split(/\n{2,}/).map(function (para) {
                  return '<p>' + esc(para).replace(/\n/g, '<br>') + '</p>';
                }).join('') +
              '</article>' +
              '<hr style="border:0;border-top:1px solid var(--line);margin:28px 0">'
            : '') +

          /* 海峰的簡介是 HTML，清掉標籤與屬性之後才放行 */
          '<article class="prose player-bio">' +
            (P.safeHtml(p.body) || '<p class="muted">暫無簡介。</p>') + '</article>' +

          '<p class="src-note mt-3">資料來源：<strong>' + esc(data.source) + '</strong>' +
            (p.source ? '　·　<a href="' + esc(p.source) + '">原始頁面 ↗</a>' : '') +
          '</p>' +

          '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;justify-content:space-between">' +
            (prev ? '<a class="btn btn-ghost btn-sm" href="profile.html?id=' + encodeURIComponent(prev.id) + '">← ' + esc(prev.name) + '</a>' : '<span></span>') +
            '<a class="btn btn-ghost btn-sm" href="index.html">回到棋士名錄</a>' +
            (next ? '<a class="btn btn-ghost btn-sm" href="profile.html?id=' + encodeURIComponent(next.id) + '">' + esc(next.name) + ' →</a>' : '<span></span>') +
          '</div>' +
        '</div>' +
      '</div>';
    liveSeason(p);

  }).catch(function (err) {
    document.getElementById('pName').textContent = '載入失敗';
    wrap.innerHTML = '<p class="muted">無法載入棋士資料（' + esc(err.message) + '）。</p>';
  });
})();
</script>
</body>
</html>
