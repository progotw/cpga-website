<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋士介紹｜中華職業圍棋協會</title>

<meta property="og:type" content="website">

<meta property="og:title" content="棋士介紹｜中華職業圍棋協會">
<meta property="og:description" content="中華職業圍棋協會棋士個人頁：段位、經歷、戰績與個人簡介。">
<meta property="og:url" content="https://cpga.org.tw/players/profile">
<meta property="og:image" content="https://cpga.org.tw/assets/img/share.jpg">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffffff'/><circle cx='12.5' cy='16' r='8.2' fill='none' stroke='%23111111' stroke-width='2.6'/><circle cx='20.5' cy='16' r='7.8' fill='%233f3b39'/></svg>">
<style>
  /* 棋戰履歷為原站富文字內容，統一排版 */
  .player-bio p { margin: 0 0 .9em; }
  .player-bio strong { color: var(--ink); }
  .player-bio br + br { display: none; }

  /* 近期對局表：欄位多，字和內距都調小一點，
     日期、姓名、棋譜連結不要被折成兩行（放不下時整張表橫向捲動）。 */
  #recentGames .table { min-width: 640px; }
  #recentGames .table th,
  #recentGames .table td { padding: 10px 12px; font-size: .86rem; }
  #recentGames .table td:nth-child(1),
  #recentGames .table td:nth-child(3),
  #recentGames .table td:nth-child(7) { white-space: nowrap; }
  #recentGames .table td .muted { font-size: .82em; }
  /* 勝負只用 ○ ✕ 兩個符號，不加膠囊底色（院長 2026-11-24 指定）。
     這兩個符號比中文字小，字級要再放大一點才看得清楚。 */
  #recentGames .table .wl { font-size: 1.05rem; font-weight: 700; color: var(--ink-3); }
</style>
</head>
<body data-nav="players">
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <nav class="breadcrumb">
      <a href="../index.html">首頁</a><span class="sep">/</span>
      <a href="index.html">職業棋士</a><span class="sep">/</span><span id="bcName">棋士介紹</span>
    </nav>
    <h1 id="pName">—</h1>
    <p id="pSub"></p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div id="profileWrap"><p class="muted">載入中…</p></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../assets/js/players.js"></script>
<!-- 成績資料。原本載入海峰那邊的 player-widget.js，但那支程式放在
     對方的 GitHub Pages，內容隨時可改而我們不會知道——它被載入在
     有登入身分的頁面上，對方帳號被盜就等於我們的權限被拿走。
     改成自己讀同一份公開資料，不執行任何外部程式。 -->
<script src="../assets/js/results.js"></script>
<script src="../assets/js/site.js" defer></script>
<script>
(function () {
  var P = window.CPGA_PLAYERS;
  var id = new URLSearchParams(location.search).get('id');
  var wrap = document.getElementById('profileWrap');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 棋士自述另存一份：players.json 每天重新產生，把本人寫的內容寫進去
     會被下一次抓取蓋掉，所以分開放、在這裡合併。 */
  function tiles(rows) {
    return rows.map(function (s) {
      return '<div class="stat-tile">' +
        '<div class="stat-tile__label">' + esc(s.label) + '</div>' +
        '<div class="stat-tile__value" style="font-size:1.25rem">' + esc(s.value) + '</div></div>';
    }).join('');
  }

  /* ---- 近期對局 ----
     院長 2026-11-23 要求公開的棋士個人頁也看得到最近幾場成績（比照日本棋院）。
     資料沿用年度成績那一次查詢（今年＋去年），不另外再抓一次。
     「今後的賽程」取自抽籤公告 pairings.json，與職業棋士專區同一份；
     那份本來就是海峰公開的抽籤結果，不是個資。
     排序比照日本棋院：舊的在上、今後的排最後。 */
  var RECENT_N = 10;

  /* 台灣時間的今天（YYYY-MM-DD）。看的人可能人在國外或電腦時區不準。 */
  function twToday() {
    var t = new Date(Date.now() + 8 * 3600000);
    return t.toISOString().slice(0, 10);
  }
  function pad2(n) { return ('0' + n).slice(-2); }
  /* 成績資料的日期是 M.D，年份另外存 */
  function dateParts(year, md) {
    var m = String(md == null ? '' : md).match(/^(\d{1,2})[.](\d{1,2})$/);
    return m ? { y: String(year), m: pad2(m[1]), d: pad2(m[2]) } : null;
  }
  function gameDay(g) {
    var x = dateParts(g.year, g.date);
    return x ? x.y + '-' + x.m + '-' + x.d : '';
  }
  function dayLabel(iso) { return String(iso).replace(/-/g, '/'); }

  function renderRecent(r, p, data) {
    var box = document.getElementById('recentGames');
    if (!box) return;

    var roster = {};
    (data.players || []).forEach(function (x) { if (x && x.name) roster[x.name] = x; });

    var games = (r.games || []).slice();        /* HaifongResults 給的是新到舊 */
    var showAll = false;

    fetch('../assets/data/pairings.json', { cache: 'no-cache' })
      .then(function (res) { return res.ok ? res.json() : { pairings: [] }; })
      .catch(function () { return { pairings: [] }; })   /* 抓不到就只顯示成績 */
      .then(function (pj) {
        var today = twToday();

        /* 已經有結果的那一局不要又出現在「今後的賽程」裡
           （當天已下完，但抽籤公告還留著） */
        var played = {};
        games.forEach(function (g) { played[gameDay(g) + '|' + g.opponent] = 1; });

        var soon = (pj.pairings || []).filter(function (x) {
          return x && x.date >= today && (x.players || []).indexOf(p.name) > -1;
        }).map(function (x) {
          var ps = x.players || [];
          var opp = x.pending_opponent ? '' : ((ps[0] === p.name ? ps[1] : ps[0]) || '');
          return { date: x.date, event: x.event || '', stage: x.round || '', opponent: opp };
        }).filter(function (x) {
          return !played[x.date + '|' + x.opponent];
        }).sort(function (a, b) {
          return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
        });

        if (!games.length && !soon.length) return;

        var years = {};
        games.forEach(function (g) { years[g.year] = 1; });
        years = Object.keys(years).sort();

        /* 對手是本會棋士就連到他的個人頁；不是的（外籍、業餘）只顯示名字 */
        function who(name) {
          if (!name) return '<span class="muted">未定</span>';
          var hit = roster[name];
          var label = esc(name) +
            (hit && hit.rank ? ' <span class="muted">' + esc(hit.rank) + '</span>' : '');
          return hit
            ? '<a href="profile.html?id=' + encodeURIComponent(hit.id) + '">' + label + '</a>'
            : label;
        }

        function resultRow(g) {
          var day = gameDay(g);
          return '<tr>' +
            '<td class="num">' + esc(day ? dayLabel(day) : g.year + '/' + g.date) + '</td>' +
            /* ○ 勝、✕ 負（院長 2026-11-24 指定，比照日本棋院）。
               符號看不懂時滑鼠停著會出現「勝」「負」，讀螢幕軟體也唸得出來。 */
            '<td><span class="wl" title="' + (g.won ? '勝' : '負') + '"' +
              (g.won ? ' style="color:var(--good)"' : '') +
              '>' + (g.won ? '○' : '✕') + '</span></td>' +
            '<td>' + who(g.opponent) + '</td>' +
            '<td>' + esc(g.color) + '</td>' +
            '<td>' + esc(g.event) + '</td>' +
            '<td>' + esc(g.stage || '') + '</td>' +
            '<td>' + ((g.kifus || []).length
              ? g.kifus.map(function (u, i) {
                  return '<a href="' + esc(u) + '" target="_blank" rel="noopener">棋譜' +
                    (g.kifus.length > 1 ? ' ' + (i + 1) : '') + ' \u2197</a>';
                }).join('\u3000')
              : '') + '</td>' +
            '</tr>';
        }

        function comingRow(x) {
          return '<tr style="background:var(--paper)">' +
            '<td class="num">' + esc(dayLabel(x.date)) + '</td>' +
            '<td><span class="muted">預定</span></td>' +
            '<td>' + who(x.opponent) + '</td>' +
            '<td></td>' +
            '<td>' + esc(x.event) + '</td>' +
            '<td>' + esc(x.stage) + '</td>' +
            '<td></td>' +
            '</tr>';
        }

        function draw() {
          /* 預設只給最近幾場；畫面上由舊到新，與日本棋院一致 */
          var pick = games.slice(0, showAll ? games.length : RECENT_N).reverse();

          box.innerHTML =
            '<div class="section-head" style="margin-bottom:12px">' +
              '<h2 style="font-size:1.3rem">對局結果與今後賽程</h2></div>' +
            '<div class="table-wrap"><table class="table"><thead><tr>' +
              '<th>對局日</th><th>勝負</th><th>對手</th><th>執子</th>' +
              '<th>棋戰</th><th>階段</th><th>棋譜</th>' +
            '</tr></thead><tbody>' +
              pick.map(resultRow).join('') +
              soon.map(comingRow).join('') +
            '</tbody></table></div>' +
            '<p class="muted mt-2" style="font-size:.82rem">' +
              '「執子」是本人執黑或執白。成績即時取自海峰成績系統，' +
              '今後賽程取自抽籤公告，實際日期以大會公告為準。</p>' +
            (!showAll && games.length > RECENT_N
              ? '<p class="mb-0"><button type="button" class="btn btn-ghost btn-sm" id="moreGames">' +
                '顯示全部對局（' + esc(years.join('、')) + ' 年度共 ' + games.length + ' 局）</button></p>'
              : (showAll
                  ? '<p class="muted mb-0" style="font-size:.82rem">以上為 ' +
                    esc(years.join('、')) + ' 年度的全部對局。</p>'
                  : '')) +
            '<div style="margin-bottom:32px"></div>';

          var more = document.getElementById('moreGames');
          if (more) more.addEventListener('click', function () { showAll = true; draw(); });
        }

        draw();
      });
  }

  /* ---- 即時年度成績 ----
     成績系統的分類與我們抓的對得上：國內＝台灣職業賽、國際＝世界賽，
     去年度直接用它的年度統計（實測與抓取版完全一致）。
     任何一步失敗就保留原本的數字，不留空白。 */
  function liveSeason(p, data) {
    var box = document.getElementById('seasonTiles');
    if (!box || !window.HaifongResults || !p.name) return;

    window.HaifongResults.player(p.name).then(function (r) {
      /* 同一份查詢結果，近期對局不要再查一次 */
      try { renderRecent(r, p, data); } catch (e) { /* 近期對局壞掉不影響年度成績 */ }

      var now = new Date().getFullYear();
      var games = (r.games || []).filter(function (g) { return g.year === String(now); });
      var prev = (r.years || []).filter(function (y) {
        return String(y.year) === String(now - 1);
      })[0];
      if (!games.length && !prev) return;

      function tally(list) {
        var n = list.length;
        var w = list.filter(function (g) { return g.won; }).length;
        return n ? w + '勝' + (n - w) + '負　勝率' + (w / n * 100).toFixed(1) + '%'
                 : '0勝0負';
      }

      box.innerHTML = tiles([
        { label: '台灣職業賽',
          value: tally(games.filter(function (g) { return g.c1 !== '國際'; })) },
        { label: '世界賽',
          value: tally(games.filter(function (g) { return g.c1 === '國際'; })) },
        { label: (now - 1) + ' 年度總成績',
          value: prev ? prev.win + '勝' + prev.loss + '負　勝率' +
                        (prev.rate * 100).toFixed(1) + '%' : '—' }
      ]);

      var label = document.getElementById('seasonLabel');
      if (label) {
        label.textContent = now + ' 年度成績';
        label.insertAdjacentHTML('afterend',
          '<p class="muted mb-0" style="font-size:.82rem">即時取自海峰成績系統</p>');
      }
    }).catch(function () { /* 保留抓取版本的數字 */ });
  }

  Promise.all([
    P.load(),
    fetch('../assets/data/player_profiles.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : { profiles: [] }; })
      .catch(function () { return { profiles: [] }; })
  ]).then(function (res) {
    var data = res[0];
    var own = (res[1].profiles || []).filter(function (x) { return x.id === id; })[0] || {};
    var p = P.byId(data, id);
    if (!p) {
      document.getElementById('pName').textContent = '找不到此棋士';
      wrap.innerHTML = '<p><a href="index.html">← 回到棋士名錄</a></p>';
      return;
    }

    var list = data.players || [];
    var idx = list.indexOf(p);
    var prev = list[idx - 1], next = list[idx + 1];

    document.title = p.name + ' ' + p.rank + '｜中華職業圍棋協會';
    document.getElementById('bcName').textContent = p.name;
    document.getElementById('pName').textContent = p.name + '　' + p.rank;
    /* history 可能有「頭銜冠軍」與「歷史成績」兩列，順序不固定 */
    var hists = p.history || [];
    var record = hists.filter(function (h) { return /冠軍數/.test(h.value) || /歷史成績/.test(h.label); })[0];
    document.getElementById('pSub').textContent =
      record ? record.value : (hists[0] ? hists[0].label + '：' + hists[0].value : '本會登錄職業棋士');

    var photo = p.photo
      ? '<img src="' + esc(P.photoUrl(p)) + '" alt="' + esc(p.name) + '" ' +
        'style="width:100%;aspect-ratio:1;object-fit:cover;display:block">'
      : '<div class="player-card__photo"><span class="player-card__initial">' +
        esc(p.name.charAt(0)) + '</span></div>';

    /* 先畫每月抓取的版本，成績系統回來後再換成即時數字。
       那邊比我們新——我們一個月抓一次，他們每場比賽結束就更新。 */
    var seasonTiles = tiles(p.season || []);

    /* 本人填的排在前面，與原有連結合併；同一個網址只留一次 */
    var seenUrl = {};
    var allLinks = (own.links || []).concat(p.links || []).filter(function (l) {
      var u = (l && P.safeUrl(l.url) || '').replace(/\/+$/, '');
      if (!u || seenUrl[u]) return false;
      seenUrl[u] = 1;
      return true;
    });

    /* 網址先過協定白名單：這些連結是棋士自己填的，
       javascript: 放進 href 就會在公開頁面上執行 */
    var linkBtns = allLinks.map(function (l) {
      l = { label: l.label, url: P.safeUrl(l.url) };
      return '<a class="btn btn-ghost btn-sm" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
        esc(l.label) + ' ↗</a>';
    }).join('');

    wrap.innerHTML =
      '<div class="grid grid-aside" style="grid-template-columns:300px minmax(0,1fr);gap:44px">' +

        '<div class="stack">' +
          '<div class="card" style="padding:0;overflow:hidden;position:relative">' +
            photo +
            '<span class="player-card__rank" style="top:14px;right:14px">' + esc(p.rank) + '</span>' +
          '</div>' +
          (hists.length
            ? '<div class="card">' + hists.map(function (h, i) {
                return '<div' + (i ? ' style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"' : '') + '>' +
                  '<h3 style="font-size:.86rem;font-family:var(--sans);letter-spacing:.06em;color:var(--ink-4);margin-bottom:4px">' +
                  esc(h.label) + '</h3>' +
                  '<p class="mb-0" style="color:var(--ink);font-weight:500">' + esc(h.value) + '</p></div>';
              }).join('') + '</div>'
            : '') +
          (linkBtns
            ? '<div class="card"><h3 style="font-size:1.05rem">相關連結</h3>' +
              '<div style="display:flex;flex-direction:column;gap:8px">' + linkBtns + '</div></div>'
            : '') +
        '</div>' +

        '<div>' +
          (seasonTiles
            ? '<div class="section-head" style="margin-bottom:16px"><h2 id="seasonLabel" style="font-size:1.3rem">' +
              esc(p.seasonLabel || '年度成績') + '</h2></div>' +
              '<div class="grid grid-3" id="seasonTiles" style="margin-bottom:32px">' + seasonTiles + '</div>'
            : '') +

          /* 近期對局。成績回來之前是空的，不佔版面 */
          '<div id="recentGames"></div>' +

          /* 自述放在最上面，不取代原本的簡介——那裡面有主要棋戰履歷 */
          (own.bio
            ? '<article class="prose player-bio" style="padding-bottom:4px">' +
                own.bio.split(/\n{2,}/).map(function (para) {
                  return '<p>' + esc(para).replace(/\n/g, '<br>') + '</p>';
                }).join('') +
              '</article>' +
              '<hr style="border:0;border-top:1px solid var(--line);margin:28px 0">'
            : '') +

          /* 海峰的簡介是 HTML，清掉標籤與屬性之後才放行 */
          '<article class="prose player-bio">' +
            (P.safeHtml(p.body) || '<p class="muted">暫無簡介。</p>') + '</article>' +

          '<p class="src-note mt-3">資料來源：<strong>' + esc(data.source) + '</strong>' +
            (p.source ? '　·　<a href="' + esc(p.source) + '">原始頁面 ↗</a>' : '') +
          '</p>' +

          '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;justify-content:space-between">' +
            (prev ? '<a class="btn btn-ghost btn-sm" href="profile.html?id=' + encodeURIComponent(prev.id) + '">← ' + esc(prev.name) + '</a>' : '<span></span>') +
            '<a class="btn btn-ghost btn-sm" href="index.html">回到棋士名錄</a>' +
            (next ? '<a class="btn btn-ghost btn-sm" href="profile.html?id=' + encodeURIComponent(next.id) + '">' + esc(next.name) + ' →</a>' : '<span></span>') +
          '</div>' +
        '</div>' +
      '</div>';
    liveSeason(p, data);

  }).catch(function (err) {
    document.getElementById('pName').textContent = '載入失敗';
    wrap.innerHTML = '<p class="muted">無法載入棋士資料（' + esc(err.message) + '）。</p>';
  });
})();
</script>
</body>
</html>
