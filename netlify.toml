# Netlify 只發布 site/ 這個資料夾，scripts/ 與 .github/ 不會被公開存取。
[build]
  publish = "site"
  command = ""

# 舊的棋士專區示意頁已移出發布目錄；仍有書籤的人導回專區說明頁。
# Netlify 會先比對實際檔案，所以 /member/index.html 本身不受影響。
[[redirects]]
  from = "/member/*"
  to = "/member/index.html"
  status = 301

# 甄選頁幾經調整，舊網址一律導向合併後的職業棋士甄選頁。
[[redirects]]
  from = "/events/apply.html"
  to = "/events/qualification.html"
  status = 301

[[redirects]]
  from = "/events/social.html"
  to = "/events/qualification.html"
  status = 301

[[redirects]]
  from = "/events/institute.html"
  to = "/events/qualification.html"
  status = 301
